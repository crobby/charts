apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rancher-webhook
rules:
# Core resources
- apiGroups: [""]
  resources: [namespaces]
  verbs: [get, list, watch, create]
- apiGroups: [""]
  resources: [secrets]
  verbs: [get, list, watch, create, update, delete]
- apiGroups: [""]
  resources: [serviceaccounts]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [nodes]
  verbs: [get, list, watch]
# RBAC
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: [roles]
  verbs: [get, list, watch, update]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: [rolebindings]
  verbs: [get, list, watch, create]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: [clusterroles]
  verbs: [get, list, watch, create, update]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: [clusterrolebindings]
  verbs: [get, list, watch, create]
# Permission and self-config
- apiGroups: ["authorization.k8s.io"]
  resources: [subjectaccessreviews]
  verbs: [create]
- apiGroups: ["admissionregistration.k8s.io"]
  resources: [validatingwebhookconfigurations, mutatingwebhookconfigurations]
  verbs: [get, create, update]
- apiGroups: ["coordination.k8s.io"]
  resources: [leases]
  verbs: [get, create, update, watch]
# Rancher management.cattle.io reads
- apiGroups: ["management.cattle.io"]
  resources:
  - authconfigs
  - clusterproxyconfigs
  - clusters
  - clusterroletemplatebindings
  - features
  - globalrolebindings
  - globalroles
  - groupmembers
  - groups
  - nodedrivers
  - nodes
  - podsecurityadmissionconfigurationtemplates
  - projectroletemplatebindings
  - projects
  - roletemplates
  - settings
  - tokens
  - userattributes
  - users
  verbs: [get, list, watch]
# Discovery / extension APIs (watched by clients.go cache initialization)
- apiGroups: ["apiextensions.k8s.io"]
  resources: [customresourcedefinitions]
  verbs: [get, list, watch]
- apiGroups: ["apiregistration.k8s.io"]
  resources: [apiservices]
  verbs: [get, list, watch]
# fleetworkspaces: read by validators; full verbs are required because the
# FleetWorkspace mutator creates a "fleetworkspace-own-{name}" ClusterRole
# with "*" verbs on a single fleetworkspace and immediately binds it. K8s
# RBAC escalation prevention requires the webhook to literally hold "*" to
# grant "*".
- apiGroups: ["management.cattle.io"]
  resources: [fleetworkspaces]
  verbs: ["*"]
# Allow the webhook to bind the well-known fleetworkspace-admin ClusterRole
# into per-FleetWorkspace namespaces without itself holding the underlying
# fleet.cattle.io perms.
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: [clusterroles]
  resourceNames: [fleetworkspace-admin]
  verbs: [bind]
# Other Rancher API groups
- apiGroups: ["provisioning.cattle.io"]
  resources: [clusters]
  verbs: [get, list, watch]
- apiGroups: ["rke.cattle.io"]
  resources: [etcdsnapshots]
  verbs: [get, list, watch]
- apiGroups: ["cluster.cattle.io"]
  resources: [clusterauthtokens]
  verbs: [get, list, watch]
- apiGroups: ["catalog.cattle.io"]
  resources: [clusterrepos]
  verbs: [get, list, watch]
---
# NOTE: roleRef on a ClusterRoleBinding is immutable. The previous chart
# created a binding named "rancher-webhook" pointing at cluster-admin, so
# we cannot reuse that name when switching to the narrow ClusterRole --
# the K8s API rejects roleRef updates. The binding is therefore named
# "rancher-webhook-binding". On upgrade, Helm 3 sees the old
# "rancher-webhook" CRB is no longer in the chart and deletes it, then
# creates this new one. Fresh installs simply create this binding directly.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rancher-webhook-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  {{- if .Values.rbac.useClusterAdmin }}
  name: cluster-admin
  {{- else }}
  name: rancher-webhook
  {{- end }}
subjects:
- kind: ServiceAccount
  name: rancher-webhook
  namespace: {{.Release.Namespace}}
